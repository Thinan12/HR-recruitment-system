<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LALCO HR</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login-wrap hidden">
    <form id="login-form" class="card login">
      <h1>LALCO HR</h1>
      <p class="muted center">Administrator login</p>
      <div id="login-error" class="message error hidden"></div>
      <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Login</button>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">LALCO HR</div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-page="dashboard">Dashboard</a>
        <a href="#/candidates" data-page="candidates">Candidates</a>
        <a href="#/questions" data-page="questions">Questions</a>
        <a href="#/assessments" data-page="assessments">Assessments</a>
        <a href="#/results" data-page="results">Results</a>
        <a href="#/settings" data-page="settings">Settings</a>
      </nav>
      <div class="user"><span id="whoami"></span><button id="logout" class="small" type="button">Logout</button></div>
    </header>
    <main id="view"></main>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
